name: Qualify installer and managed gateway delta
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit; compiled application inputs must match the qualified baseline
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BASELINE_SHA: cd11cc0592713233b156615a52bed714f8085ad0
      BASELINE_RUN: '40810707256'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Validate pinned input
        shell: pwsh
        run: |
          if($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$'){throw 'Exact commit required'}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Verify full-build baseline and unchanged compiled inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'Checkout mismatch'}
          $baseline=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BASELINE_RUN" | ConvertFrom-Json
          if($LASTEXITCODE -or $baseline.head_sha -ne $env:BASELINE_SHA -or $baseline.conclusion -ne 'success'){throw 'Qualified baseline unavailable'}
          git fetch --depth=1 origin $env:BASELINE_SHA a26a46d2ffa302980ff4cca12eb5af19113d6669
          if($LASTEXITCODE){throw 'Baseline source fetch failed'}
          $allowed=@('.github/workflows/qualify-installer-gateway.yml','apps/examples/desktop-app/src-tauri/nsis/installer-hooks.nsh','apps/examples/desktop-app/scripts/windows-installer.test.ts','fork/dsw2api/gateway/managed_runner.py','fork/dsw2api/test-managed.py','README.md','README.ru.md','fork/components.json','fork/qualification.json','fork/review-ledger.json','fork/discovery.json','fork/performance.md','fork/history-policy.md')
          $changed=@(git diff --name-only $env:BASELINE_SHA HEAD)
          if($LASTEXITCODE -or @($changed|Where-Object {$_ -notin $allowed}).Count){throw 'Compiled inputs changed: use the full Windows build workflow'}
          @{source_sha=$env:SOURCE_SHA;baseline_sha=$env:BASELINE_SHA;baseline_run=$env:BASELINE_RUN;compiled_inputs_unchanged=$true;changed=$changed}|ConvertTo-Json -Depth 4|Set-Content qualification.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.13.14
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .build-cache/dsw2api
            .build-cache/downloads
          key: managed-gateway-tools-v1-${{ hashFiles('fork/dsw2api/runtime-lock.json') }}
      - name: Pinned tools, installer regressions and real gateway protocol fixture
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'bun.zip'
          python ./fork/download.py https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64-baseline.zip $archive 78c221c2376f79731ccf4e4af0b3bb46d81fefa3296c5abee09ad8a1b21e68c6
          if($LASTEXITCODE){throw 'Bun verification failed'}
          Expand-Archive $archive "$env:RUNNER_TEMP/bun"
          $env:PATH="$env:RUNNER_TEMP/bun/bun-windows-x64-baseline;$env:PATH"
          rustup toolchain install 1.97.0 --profile minimal
          if($LASTEXITCODE){throw 'Rust installation failed'}
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44.35207 -winsdk=10.0.26100.0'
          python fork/seed-nsis.py
          if($LASTEXITCODE){throw 'NSIS verification failed'}
          $env:MAKENSIS_PATH="$pwd/.build-cache/nsis/nsis-3.13/makensis.exe"
          bun test apps/examples/desktop-app/scripts/windows-installer.test.ts
          if($LASTEXITCODE){throw 'Installer regressions failed'}
          python fork/prepare-dsw2api.py
          if($LASTEXITCODE){throw 'Gateway runtime build failed'}
          & apps/examples/desktop-app/src-tauri/bin/dsw2api/runtime/python.exe -I -B -X utf8 fork/dsw2api/test-managed.py apps/examples/desktop-app/src-tauri/bin/dsw2api
          if($LASTEXITCODE){throw 'Gateway queue, tool, encryption and SSE fixture failed'}
          node --test fork/browser-bridge/extension-status.test.mjs
          if($LASTEXITCODE){throw 'Extension indicator tests failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cline-Desktop-AVX1-RU-qualification
          path: qualification.json
          retention-days: 3
          if-no-files-found: error
