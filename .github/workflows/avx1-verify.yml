name: Verify minimal AVX1 source
on:
  push:
    branches: [avx1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'aktalascloud/cline-desktop-ivybridge-avx1'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.14'
      - run: python fork/check-patches.py
